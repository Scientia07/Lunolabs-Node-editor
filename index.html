<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netzwerk-Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1117;
  --bg-surface: #1a1d27;
  --bg-elevated: #242836;
  --border: #2e3348;
  --border-hover: #4a5072;
  --text: #e2e4ed;
  --text-muted: #8b90a8;
  --text-dim: #5a5f7a;
  --accent: #6c8aff;
  --accent-hover: #8aa4ff;
  --accent-dim: rgba(108,138,255,0.15);
  --danger: #ff6b6b;
  --success: #5cdb95;
  --warning: #ffd166;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.6);
  --radius: 8px;
  --radius-lg: 12px;
  --font-body: 'DM Sans', sans-serif;
  --font-mono: 'Space Mono', monospace;
  --toolbar-h: 52px;
  --minimap-w: 180px;
  --minimap-h: 120px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  user-select: none;
  -webkit-user-select: none;
}

/* ── TOOLBAR ── */
#toolbar {
  position: fixed;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  display: flex;
  align-items: center;
  gap: 2px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 4px;
  box-shadow: var(--shadow-lg);
  backdrop-filter: blur(20px);
}

#toolbar .sep {
  width: 1px;
  height: 28px;
  background: var(--border);
  margin: 0 4px;
}

.tb-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  height: 36px;
  padding: 0 12px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius);
  color: var(--text-muted);
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  letter-spacing: 0.02em;
}

.tb-btn:hover {
  background: var(--bg-elevated);
  color: var(--text);
  border-color: var(--border);
}

.tb-btn.active {
  background: var(--accent-dim);
  color: var(--accent);
  border-color: rgba(108,138,255,0.3);
}

.tb-btn svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.tb-btn.icon-only { padding: 0 8px; }

/* Shape dropdown */
.dropdown-wrap { position: relative; }
.dropdown-menu {
  display: none;
  position: absolute;
  top: 44px;
  left: 0;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 4px;
  box-shadow: var(--shadow-lg);
  z-index: 2000;
  min-width: 140px;
}
.dropdown-menu.open { display: block; }
.dropdown-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 12px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.1s;
}
.dropdown-item:hover {
  background: var(--bg-elevated);
  color: var(--text);
}

/* Export dropdown */
.export-dropdown {
  display: none;
  position: absolute;
  top: 44px;
  right: 0;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 4px;
  box-shadow: var(--shadow-lg);
  z-index: 2000;
  min-width: 160px;
}
.export-dropdown.open { display: block; }

/* ── CANVAS ── */
#canvas-container {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  overflow: hidden;
  cursor: grab;
}

#canvas-container.panning { cursor: grabbing; }
#canvas-container.connecting { cursor: crosshair; }
#canvas-container.selecting { cursor: crosshair; }

#canvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  transform-origin: 0 0;
}

#grid-canvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

#connections-layer {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
  overflow: visible;
}

#connections-layer path {
  pointer-events: stroke;
  cursor: pointer;
}

#connections-layer path:hover {
  stroke-width: 3.5 !important;
  filter: drop-shadow(0 0 6px currentColor);
}

#nodes-layer {
  position: absolute;
  top: 0; left: 0;
  z-index: 2;
}

#selection-rect {
  position: absolute;
  border: 1.5px dashed var(--accent);
  background: rgba(108,138,255,0.08);
  pointer-events: none;
  z-index: 999;
  display: none;
  border-radius: 2px;
}

/* ── NODE STYLES ── */
.node {
  position: absolute;
  cursor: move;
  transition: box-shadow 0.15s;
}

.node.selected {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

.node:hover { z-index: 100; }

.node-sector {
  min-width: 140px;
  min-height: 60px;
  border-radius: var(--radius-lg);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px 24px;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-align: center;
  box-shadow: var(--shadow);
  border: 2px solid rgba(255,255,255,0.1);
}

.node-sector .node-label {
  outline: none;
  min-width: 40px;
  text-align: center;
  color: inherit;
}

.node-company {
  min-width: 90px;
  padding: 8px 16px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: var(--bg-elevated);
  border: 1.5px solid var(--border);
  color: var(--text);
  box-shadow: 0 2px 12px rgba(0,0,0,0.3);
}

.node-company .node-label {
  outline: none;
  min-width: 30px;
  text-align: center;
}

.node-company .color-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 8px;
  flex-shrink: 0;
}

.node-sticky {
  width: 160px;
  min-height: 100px;
  padding: 14px 16px;
  border-radius: 3px;
  font-size: 13px;
  line-height: 1.5;
  box-shadow: 2px 4px 16px rgba(0,0,0,0.35);
  border: none;
  position: relative;
}

.node-sticky .node-label {
  outline: none;
  min-width: 40px;
  width: 100%;
  word-wrap: break-word;
  color: #1a1a1a;
  font-weight: 400;
}

.node-sticky .sticky-fold {
  position: absolute;
  bottom: 0; right: 0;
  width: 20px; height: 20px;
  background: linear-gradient(135deg, transparent 50%, rgba(0,0,0,0.1) 50%);
  border-radius: 0 0 3px 0;
}

.node-rect {
  min-width: 120px;
  min-height: 70px;
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px 16px;
  font-size: 13px;
  text-align: center;
  border: 2px solid var(--border);
  background: var(--bg-elevated);
  box-shadow: var(--shadow);
}

.node-circle {
  min-width: 90px;
  min-height: 90px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  font-size: 13px;
  text-align: center;
  border: 2px solid var(--border);
  background: var(--bg-elevated);
  box-shadow: var(--shadow);
}

.node-textbox {
  min-width: 80px;
  padding: 8px 12px;
  font-size: 14px;
  background: transparent;
  border: 1px dashed var(--border);
  border-radius: 4px;
  color: var(--text);
}

.node-textbox .node-label,
.node-rect .node-label,
.node-circle .node-label {
  outline: none;
  min-width: 30px;
  text-align: center;
  color: var(--text);
}

/* Anchor points */
.node .anchor {
  position: absolute;
  width: 12px; height: 12px;
  background: var(--accent);
  border: 2px solid var(--bg);
  border-radius: 50%;
  opacity: 0;
  transition: opacity 0.15s, transform 0.15s;
  cursor: crosshair;
  z-index: 10;
  transform: scale(0.6);
}

.node:hover .anchor, .node.selected .anchor {
  opacity: 1;
  transform: scale(1);
}

.node .anchor-top { top: -6px; left: 50%; margin-left: -6px; }
.node .anchor-bottom { bottom: -6px; left: 50%; margin-left: -6px; }
.node .anchor-left { left: -6px; top: 50%; margin-top: -6px; }
.node .anchor-right { right: -6px; top: 50%; margin-top: -6px; }

.node .resize-handle {
  position: absolute;
  bottom: 0; right: 0;
  width: 16px; height: 16px;
  cursor: nwse-resize;
  z-index: 5;
}

/* ── MINIMAP ── */
#minimap {
  position: fixed;
  bottom: 16px; right: 16px;
  width: var(--minimap-w);
  height: var(--minimap-h);
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  z-index: 900;
  box-shadow: var(--shadow);
}

#minimap canvas { width: 100%; height: 100%; }

#minimap-viewport {
  position: absolute;
  border: 1.5px solid var(--accent);
  background: rgba(108,138,255,0.08);
  pointer-events: none;
  border-radius: 2px;
}

/* ── ZOOM INDICATOR ── */
#zoom-indicator {
  position: fixed;
  bottom: 16px;
  right: calc(var(--minimap-w) + 28px);
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 4px;
  z-index: 900;
  box-shadow: var(--shadow);
}

#zoom-indicator .tb-btn { height: 30px; padding: 0 8px; font-size: 11px; }

#zoom-level {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  min-width: 44px;
  text-align: center;
}

/* ── CONTEXT MENU ── */
#context-menu {
  display: none;
  position: fixed;
  z-index: 3000;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 4px;
  box-shadow: var(--shadow-lg);
  min-width: 160px;
}

#context-menu.open { display: block; }

.ctx-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 12px;
  border-radius: 6px;
  font-size: 12px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.1s;
}

.ctx-item:hover { background: var(--bg-elevated); color: var(--text); }
.ctx-item.danger { color: var(--danger); }
.ctx-item.danger:hover { background: rgba(255,107,107,0.1); }
.ctx-item .shortcut {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  margin-left: 20px;
}

.ctx-sep { height: 1px; background: var(--border); margin: 4px 8px; }

/* ── COLOR POPUP ── */
.color-popup {
  position: fixed;
  z-index: 2500;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 12px;
  box-shadow: var(--shadow-lg);
  display: none;
}

.color-popup.open { display: block; }

.color-popup h4 {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 8px;
}

.color-swatches {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 4px;
  margin-bottom: 8px;
}

.color-swatch {
  width: 28px; height: 28px;
  border-radius: 6px;
  border: 2px solid transparent;
  cursor: pointer;
  transition: all 0.1s;
}

.color-swatch:hover { transform: scale(1.15); border-color: rgba(255,255,255,0.3); }
.color-swatch.active { border-color: white; box-shadow: 0 0 0 2px var(--accent); }

.color-popup input[type="color"] {
  width: 100%; height: 32px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg-elevated);
  cursor: pointer;
  padding: 2px;
}

/* ── TOAST ── */
#toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 20px;
  border-radius: var(--radius);
  font-size: 13px;
  z-index: 5000;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: var(--shadow-lg);
  pointer-events: none;
}

#toast.show { transform: translateX(-50%) translateY(0); }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<!-- TOOLBAR -->
<div id="toolbar">
  <button class="tb-btn active" data-tool="select" title="Auswahl (V)">
    <svg viewBox="0 0 24 24"><path d="M4 4l7 17 2.5-6.5L20 12z"/></svg>
    <span>Auswahl</span>
  </button>
  <div class="sep"></div>
  <button class="tb-btn" data-tool="sector" title="Sektor hinzufuegen">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    <span>Sektor</span>
  </button>
  <button class="tb-btn" data-tool="company" title="Firma hinzufuegen">
    <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><line x1="12" y1="9" x2="12" y2="15"/><line x1="9" y1="12" x2="15" y2="12"/></svg>
    <span>Firma</span>
  </button>
  <div class="sep"></div>
  <button class="tb-btn" data-tool="sticky" title="Sticky Note">
    <svg viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 00-2 2v14a2 2 0 002 2h9l5-5V5a2 2 0 00-2-2z"/><polyline points="14 17 14 21 19 16"/></svg>
    <span>Sticky</span>
  </button>
  <div class="dropdown-wrap">
    <button class="tb-btn" data-tool="shapes" id="shapes-btn" title="Formen">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><circle cx="17" cy="17" r="4"/></svg>
      <span>Formen</span>
      <svg viewBox="0 0 24 24" style="width:12px;height:12px;margin-left:-2px"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="dropdown-menu" id="shapes-dropdown">
      <div class="dropdown-item" data-shape="rect">
        <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8"><rect x="4" y="6" width="16" height="12" rx="2"/></svg>
        Rechteck
      </div>
      <div class="dropdown-item" data-shape="circle">
        <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8"><circle cx="12" cy="12" r="8"/></svg>
        Kreis
      </div>
      <div class="dropdown-item" data-shape="textbox">
        <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
        Textbox
      </div>
    </div>
  </div>
  <button class="tb-btn" data-tool="connect" title="Verbindung (C)">
    <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"/><circle cx="5" cy="19" r="2" fill="currentColor"/><circle cx="19" cy="5" r="2" fill="currentColor"/></svg>
    <span>Verbinden</span>
  </button>
  <div class="sep"></div>
  <button class="tb-btn icon-only" id="grid-toggle" title="Raster (G)">
    <svg viewBox="0 0 24 24"><line x1="12" y1="3" x2="12" y2="21"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="3" x2="3" y2="21"/><line x1="21" y1="3" x2="21" y2="21"/><line x1="3" y1="3" x2="21" y2="3"/><line x1="3" y1="21" x2="21" y2="21"/></svg>
  </button>
  <div class="sep"></div>
  <button class="tb-btn icon-only" id="undo-btn" title="Ctrl+Z">
    <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 105.64-8.36L1 10"/></svg>
  </button>
  <button class="tb-btn icon-only" id="redo-btn" title="Ctrl+Y">
    <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-5.64-8.36L23 10"/></svg>
  </button>
  <div class="sep"></div>

  <!-- Export dropdown -->
  <div class="dropdown-wrap">
    <button class="tb-btn" id="export-wrap-btn" title="Exportieren">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>Export</span>
      <svg viewBox="0 0 24 24" style="width:12px;height:12px;margin-left:-2px"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="export-dropdown" id="export-dropdown">
      <div class="dropdown-item" id="export-json-btn">
        <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        JSON speichern
      </div>
      <div class="dropdown-item" id="export-png-btn">
        <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        PNG exportieren
      </div>
    </div>
  </div>

  <button class="tb-btn icon-only" id="import-btn" title="Importieren">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
  </button>
</div>

<!-- CANVAS -->
<div id="canvas-container">
  <canvas id="grid-canvas"></canvas>
  <div id="canvas">
    <svg id="connections-layer"></svg>
    <div id="nodes-layer"></div>
  </div>
  <div id="selection-rect"></div>
</div>

<!-- MINIMAP -->
<div id="minimap">
  <canvas id="minimap-canvas"></canvas>
  <div id="minimap-viewport"></div>
</div>

<!-- ZOOM CONTROLS -->
<div id="zoom-indicator">
  <button class="tb-btn" id="zoom-out">
    <svg viewBox="0 0 24 24" style="width:14px;height:14px"><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
  <span id="zoom-level">100%</span>
  <button class="tb-btn" id="zoom-in">
    <svg viewBox="0 0 24 24" style="width:14px;height:14px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
  <button class="tb-btn" id="zoom-fit" style="font-size:10px;font-family:var(--font-mono)">FIT</button>
</div>

<!-- CONTEXT MENU -->
<div id="context-menu"></div>

<!-- COLOR POPUP -->
<div class="color-popup" id="color-popup">
  <h4>Farbe waehlen</h4>
  <div class="color-swatches" id="color-swatches"></div>
  <input type="color" id="custom-color" value="#6c8aff">
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- HIDDEN FILE INPUT -->
<input type="file" id="file-input" accept=".json" style="display:none">

<script>
// ─── STATE ───
const state = {
  nodes: [],
  connections: [],
  tool: 'select',
  shapeType: 'rect',
  zoom: 1,
  panX: 0,
  panY: 0,
  gridEnabled: true,
  snapEnabled: true,
  gridSize: 40,
  selectedIds: new Set(),
  undoStack: [],
  redoStack: [],
  nextId: 1,
  connectingFrom: null,
  connectionColor: '#6c8aff',
};

const PALETTE = [
  '#6c8aff','#ff6b6b','#5cdb95','#ffd166','#a78bfa',
  '#f472b6','#38bdf8','#fb923c','#34d399','#e879f9',
  '#818cf8','#fbbf24'
];
const STICKY_COLORS = ['#fef08a','#fca5a5','#86efac','#93c5fd','#c4b5fd','#fdba74'];

// ─── DOM REFS ───
const canvasContainer = document.getElementById('canvas-container');
const canvas = document.getElementById('canvas');
const gridCanvas = document.getElementById('grid-canvas');
const gridCtx = gridCanvas.getContext('2d');
const svgLayer = document.getElementById('connections-layer');
const nodesLayer = document.getElementById('nodes-layer');
const selRect = document.getElementById('selection-rect');
const contextMenu = document.getElementById('context-menu');
const colorPopup = document.getElementById('color-popup');
const minimapCanvas = document.getElementById('minimap-canvas');
const minimapCtx = minimapCanvas.getContext('2d');
const minimapViewport = document.getElementById('minimap-viewport');
const toastEl = document.getElementById('toast');

// ─── UTILITY ───
function genId() { return state.nextId++; }

function screenToCanvas(sx, sy) {
  return { x: (sx - state.panX) / state.zoom, y: (sy - state.panY) / state.zoom };
}

function snapToGrid(v) {
  if (!state.snapEnabled || !state.gridEnabled) return v;
  return Math.round(v / state.gridSize) * state.gridSize;
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2000);
}

function getContrastColor(hex) {
  if (!hex || hex.charAt(0) !== '#') return '#ffffff';
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return (0.299*r + 0.587*g + 0.114*b) / 255 > 0.6 ? '#1a1a2e' : '#ffffff';
}

// ─── UNDO / REDO ───
function saveSnapshot() {
  state.undoStack.push(JSON.stringify({ nodes: state.nodes, connections: state.connections, nextId: state.nextId }));
  state.redoStack = [];
  if (state.undoStack.length > 80) state.undoStack.shift();
  autoSave();
}

function undo() {
  if (!state.undoStack.length) return;
  state.redoStack.push(JSON.stringify({ nodes: state.nodes, connections: state.connections, nextId: state.nextId }));
  const snap = JSON.parse(state.undoStack.pop());
  Object.assign(state, { nodes: snap.nodes, connections: snap.connections, nextId: snap.nextId });
  state.selectedIds.clear();
  fullRender();
  autoSave();
}

function redo() {
  if (!state.redoStack.length) return;
  state.undoStack.push(JSON.stringify({ nodes: state.nodes, connections: state.connections, nextId: state.nextId }));
  const snap = JSON.parse(state.redoStack.pop());
  Object.assign(state, { nodes: snap.nodes, connections: snap.connections, nextId: snap.nextId });
  state.selectedIds.clear();
  fullRender();
  autoSave();
}

// ─── PERSISTENCE ───
function autoSave() {
  try {
    localStorage.setItem('network-editor-state', JSON.stringify({
      nodes: state.nodes, connections: state.connections, nextId: state.nextId,
      zoom: state.zoom, panX: state.panX, panY: state.panY, gridEnabled: state.gridEnabled,
    }));
  } catch(e) {}
}

function autoLoad() {
  try {
    const raw = localStorage.getItem('network-editor-state');
    if (!raw) return;
    const d = JSON.parse(raw);
    state.nodes = d.nodes || [];
    state.connections = d.connections || [];
    state.nextId = d.nextId || 1;
    state.zoom = d.zoom || 1;
    state.panX = d.panX || 0;
    state.panY = d.panY || 0;
    state.gridEnabled = d.gridEnabled !== false;
  } catch(e) {}
}

function exportJSON() {
  const data = JSON.stringify({
    nodes: state.nodes, connections: state.connections, nextId: state.nextId,
    exportedAt: new Date().toISOString()
  }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'netzwerk-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('JSON exportiert!');
}

function importJSON(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      saveSnapshot();
      state.nodes = d.nodes || [];
      state.connections = d.connections || [];
      state.nextId = d.nextId || 1;
      state.selectedIds.clear();
      fullRender();
      autoSave();
      showToast('Importiert!');
    } catch(e) { showToast('Fehler beim Import'); }
  };
  reader.readAsText(file);
}

// ─── PNG EXPORT ───
function exportPNG() {
  if (!state.nodes.length) { showToast('Keine Elemente zum Exportieren'); return; }

  showToast('PNG wird erstellt...');

  // Calculate bounding box of all nodes
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  const nodeEls = nodesLayer.querySelectorAll('.node');
  state.nodes.forEach((n, i) => {
    const el = nodesLayer.querySelector(`[data-id="${n.id}"]`);
    const w = el ? el.offsetWidth : (n.width || 140);
    const h = el ? el.offsetHeight : (n.height || 60);
    minX = Math.min(minX, n.x);
    minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + w);
    maxY = Math.max(maxY, n.y + h);
  });

  const pad = 60;
  minX -= pad; minY -= pad; maxX += pad; maxY += pad;
  const canvasW = maxX - minX;
  const canvasH = maxY - minY;

  const c = document.createElement('canvas');
  const scale = 2; // retina
  c.width = canvasW * scale;
  c.height = canvasH * scale;
  const ctx = c.getContext('2d');
  ctx.scale(scale, scale);

  // White background
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvasW, canvasH);

  // Draw connections
  state.connections.forEach(conn => {
    const fromNode = state.nodes.find(n => n.id === conn.from);
    const toNode = state.nodes.find(n => n.id === conn.to);
    if (!fromNode || !toNode) return;

    const fc = getNodeCenter(fromNode);
    const tc = getNodeCenter(toNode);
    const fx = fc.x - minX, fy = fc.y - minY;
    const tx = tc.x - minX, ty = tc.y - minY;

    const dx = tx - fx;
    ctx.beginPath();
    ctx.moveTo(fx, fy);
    ctx.bezierCurveTo(fx + dx * 0.4, fy, tx - dx * 0.4, ty, tx, ty);
    ctx.strokeStyle = conn.color || '#6c8aff';
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.7;
    ctx.stroke();
    ctx.globalAlpha = 1;
  });

  // Draw nodes
  state.nodes.forEach(n => {
    const el = nodesLayer.querySelector(`[data-id="${n.id}"]`);
    const w = el ? el.offsetWidth : (n.width || 140);
    const h = el ? el.offsetHeight : (n.height || 60);
    const x = n.x - minX;
    const y = n.y - minY;

    ctx.save();

    if (n.type === 'sector') {
      // Rounded rect with fill
      const r = 12;
      ctx.fillStyle = n.color || '#6c8aff';
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.fill();
      // Border
      ctx.strokeStyle = 'rgba(0,0,0,0.1)';
      ctx.lineWidth = 2;
      ctx.stroke();
      // Label
      ctx.fillStyle = getContrastColor(n.color || '#6c8aff');
      ctx.font = '600 16px DM Sans, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(n.label || '', x + w/2, y + h/2);

    } else if (n.type === 'company') {
      // Rect with light bg
      const r = 8;
      ctx.fillStyle = '#f0f0f5';
      ctx.strokeStyle = '#d0d0dd';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // Color dot
      ctx.fillStyle = n.color || '#6c8aff';
      ctx.beginPath();
      ctx.arc(x + 16, y + h/2, 4, 0, Math.PI * 2);
      ctx.fill();
      // Label
      ctx.fillStyle = '#1a1a2e';
      ctx.font = '500 13px DM Sans, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(n.label || '', x + w/2 + 6, y + h/2);

    } else if (n.type === 'sticky') {
      ctx.fillStyle = n.color || '#fef08a';
      ctx.shadowColor = 'rgba(0,0,0,0.15)';
      ctx.shadowBlur = 8;
      ctx.shadowOffsetY = 2;
      ctx.fillRect(x, y, w, h);
      ctx.shadowColor = 'transparent';
      // Label
      ctx.fillStyle = '#1a1a1a';
      ctx.font = '400 13px DM Sans, sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      // Word wrap
      wrapText(ctx, n.label || '', x + 14, y + 14, w - 28, 18);

    } else if (n.type === 'circle') {
      const r = Math.min(w, h) / 2;
      ctx.fillStyle = n.color || '#f0f0f5';
      ctx.strokeStyle = n.borderColor || '#d0d0dd';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x + w/2, y + h/2, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#1a1a2e';
      ctx.font = '400 13px DM Sans, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(n.label || '', x + w/2, y + h/2);

    } else if (n.type === 'rect') {
      const r = 8;
      ctx.fillStyle = n.color || '#f0f0f5';
      ctx.strokeStyle = n.borderColor || '#d0d0dd';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#1a1a2e';
      ctx.font = '400 13px DM Sans, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(n.label || '', x + w/2, y + h/2);

    } else if (n.type === 'textbox') {
      ctx.fillStyle = '#1a1a2e';
      ctx.font = '400 14px DM Sans, sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      wrapText(ctx, n.label || '', x + 8, y + 8, (w || 200) - 16, 20);
    }

    ctx.restore();
  });

  // Download
  c.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'netzwerk-' + new Date().toISOString().slice(0,10) + '.png';
    a.click();
    URL.revokeObjectURL(url);
    showToast('PNG exportiert!');
  }, 'image/png');
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '';
  let ty = y;
  for (let w of words) {
    const test = line + w + ' ';
    if (ctx.measureText(test).width > maxWidth && line) {
      ctx.fillText(line.trim(), x, ty);
      line = w + ' ';
      ty += lineHeight;
    } else {
      line = test;
    }
  }
  if (line.trim()) ctx.fillText(line.trim(), x, ty);
}

// ─── RENDERING ───
function updateTransform() {
  canvas.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.zoom})`;
  document.getElementById('zoom-level').textContent = Math.round(state.zoom * 100) + '%';
  drawGrid();
  updateMinimap();
}

function drawGrid() {
  const w = window.innerWidth, h = window.innerHeight;
  gridCanvas.width = w;
  gridCanvas.height = h;
  if (!state.gridEnabled) return;

  const gs = state.gridSize * state.zoom;
  const offsetX = state.panX % gs;
  const offsetY = state.panY % gs;

  gridCtx.clearRect(0, 0, w, h);
  for (let x = offsetX; x < w; x += gs) {
    const idx = Math.round((x - state.panX) / gs);
    gridCtx.strokeStyle = idx % 5 === 0 ? 'rgba(108,138,255,0.1)' : 'rgba(108,138,255,0.04)';
    gridCtx.lineWidth = idx % 5 === 0 ? 1 : 0.5;
    gridCtx.beginPath(); gridCtx.moveTo(x, 0); gridCtx.lineTo(x, h); gridCtx.stroke();
  }
  for (let y = offsetY; y < h; y += gs) {
    const idx = Math.round((y - state.panY) / gs);
    gridCtx.strokeStyle = idx % 5 === 0 ? 'rgba(108,138,255,0.1)' : 'rgba(108,138,255,0.04)';
    gridCtx.lineWidth = idx % 5 === 0 ? 1 : 0.5;
    gridCtx.beginPath(); gridCtx.moveTo(0, y); gridCtx.lineTo(w, y); gridCtx.stroke();
  }
}

function finishActiveEdit() {
  const active = nodesLayer.querySelector('[contenteditable="true"]');
  if (active) active.blur();
}

function renderNodes() {
  finishActiveEdit();
  nodesLayer.innerHTML = '';
  state.nodes.forEach(n => nodesLayer.appendChild(createNodeElement(n)));
}

function createNodeElement(n) {
  const el = document.createElement('div');
  el.className = 'node node-' + n.type;
  el.dataset.id = n.id;
  el.style.left = n.x + 'px';
  el.style.top = n.y + 'px';

  if (n.type === 'sector') {
    el.style.background = n.color || '#6c8aff';
    el.style.color = getContrastColor(n.color || '#6c8aff');
    if (n.width) el.style.width = n.width + 'px';
    if (n.height) el.style.height = n.height + 'px';
  } else if (n.type === 'company') {
    const dot = document.createElement('span');
    dot.className = 'color-dot';
    dot.style.background = n.color || '#6c8aff';
    el.appendChild(dot);
  } else if (n.type === 'sticky') {
    el.style.background = n.color || '#fef08a';
    if (n.width) el.style.width = n.width + 'px';
    if (n.height) { el.style.minHeight = n.height + 'px'; el.style.height = n.height + 'px'; }
    el.appendChild(Object.assign(document.createElement('div'), { className: 'sticky-fold' }));
    el.appendChild(Object.assign(document.createElement('div'), { className: 'resize-handle' }));
  } else if (n.type === 'rect') {
    el.style.background = n.color || 'var(--bg-elevated)';
    el.style.borderColor = n.borderColor || 'var(--border)';
    if (n.width) el.style.width = n.width + 'px';
    if (n.height) el.style.height = n.height + 'px';
  } else if (n.type === 'circle') {
    el.style.background = n.color || 'var(--bg-elevated)';
    el.style.borderColor = n.borderColor || 'var(--border)';
    if (n.width) { el.style.width = n.width + 'px'; el.style.height = n.width + 'px'; el.style.minWidth = n.width + 'px'; el.style.minHeight = n.width + 'px'; }
  }

  const label = document.createElement('span');
  label.className = 'node-label';
  label.textContent = n.label || '';
  label.setAttribute('contenteditable', 'false');
  el.appendChild(label);

  ['top','bottom','left','right'].forEach(pos => {
    const a = document.createElement('div');
    a.className = 'anchor anchor-' + pos;
    a.dataset.anchor = pos;
    el.appendChild(a);
  });

  if (state.selectedIds.has(n.id)) el.classList.add('selected');
  return el;
}

function renderConnections() {
  svgLayer.innerHTML = '';
  state.connections.forEach(c => {
    const fromNode = state.nodes.find(n => n.id === c.from);
    const toNode = state.nodes.find(n => n.id === c.to);
    if (!fromNode || !toNode) return;

    const fc = getNodeCenter(fromNode);
    const tc = getNodeCenter(toNode);
    const dx = tc.x - fc.x;

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M${fc.x},${fc.y} C${fc.x + dx*0.4},${fc.y} ${tc.x - dx*0.4},${tc.y} ${tc.x},${tc.y}`);
    path.setAttribute('stroke', c.color || '#6c8aff');
    path.setAttribute('stroke-width', '2');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke-opacity', '0.6');
    path.dataset.id = c.id;
    svgLayer.appendChild(path);
  });
}

function getNodeCenter(n) {
  const el = nodesLayer.querySelector(`[data-id="${n.id}"]`);
  if (el) return { x: n.x + el.offsetWidth / 2, y: n.y + el.offsetHeight / 2 };
  return { x: n.x + 60, y: n.y + 30 };
}

function fullRender() {
  renderNodes();
  requestAnimationFrame(() => { renderConnections(); updateMinimap(); });
  updateTransform();
}

// ─── MINIMAP ───
function updateMinimap() {
  const mw = 180, mh = 120;
  minimapCanvas.width = mw;
  minimapCanvas.height = mh;
  minimapCtx.clearRect(0, 0, mw, mh);
  if (!state.nodes.length) return;

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  state.nodes.forEach(n => {
    minX = Math.min(minX, n.x);
    minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + (n.width || 140));
    maxY = Math.max(maxY, n.y + (n.height || 60));
  });

  const pad = 100;
  minX -= pad; minY -= pad; maxX += pad; maxY += pad;
  const worldW = maxX - minX || 1, worldH = maxY - minY || 1;
  const scale = Math.min(mw / worldW, mh / worldH);

  minimapCtx.strokeStyle = 'rgba(108,138,255,0.3)';
  minimapCtx.lineWidth = 1;
  state.connections.forEach(c => {
    const f = state.nodes.find(n => n.id === c.from);
    const t = state.nodes.find(n => n.id === c.to);
    if (!f || !t) return;
    minimapCtx.beginPath();
    minimapCtx.moveTo((f.x - minX + 60) * scale, (f.y - minY + 30) * scale);
    minimapCtx.lineTo((t.x - minX + 60) * scale, (t.y - minY + 30) * scale);
    minimapCtx.stroke();
  });

  state.nodes.forEach(n => {
    const nx = (n.x - minX) * scale, ny = (n.y - minY) * scale;
    const nw = (n.width || (n.type === 'sector' ? 140 : 90)) * scale;
    const nh = (n.height || (n.type === 'sector' ? 60 : 30)) * scale;
    minimapCtx.fillStyle = n.color || (n.type === 'sticky' ? '#fef08a' : '#6c8aff');
    minimapCtx.globalAlpha = 0.7;
    if (n.type === 'circle') {
      minimapCtx.beginPath();
      minimapCtx.arc(nx + nw/2, ny + nh/2, Math.min(nw, nh)/2, 0, Math.PI * 2);
      minimapCtx.fill();
    } else {
      minimapCtx.fillRect(nx, ny, Math.max(nw, 3), Math.max(nh, 3));
    }
    minimapCtx.globalAlpha = 1;
  });

  const vw = window.innerWidth, vh = window.innerHeight;
  minimapViewport.style.left = Math.max(0, (-state.panX / state.zoom - minX) * scale) + 'px';
  minimapViewport.style.top = Math.max(0, (-state.panY / state.zoom - minY) * scale) + 'px';
  minimapViewport.style.width = (vw / state.zoom) * scale + 'px';
  minimapViewport.style.height = (vh / state.zoom) * scale + 'px';
}

// ─── TOOL SWITCHING ───
function setTool(tool) {
  state.tool = tool;
  document.querySelectorAll('.tb-btn[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === tool));
  canvasContainer.className = tool === 'connect' ? 'connecting' : '';
}

document.querySelectorAll('.tb-btn[data-tool]').forEach(btn => {
  btn.addEventListener('click', () => {
    const tool = btn.dataset.tool;
    if (tool === 'shapes') {
      document.getElementById('shapes-dropdown').classList.toggle('open');
      return;
    }
    setTool(tool);
  });
});

document.querySelectorAll('.dropdown-item[data-shape]').forEach(item => {
  item.addEventListener('click', () => {
    state.shapeType = item.dataset.shape;
    setTool('shape');
    document.getElementById('shapes-dropdown').classList.remove('open');
    document.getElementById('shapes-btn').classList.add('active');
  });
});

document.getElementById('grid-toggle').addEventListener('click', () => {
  state.gridEnabled = !state.gridEnabled;
  document.getElementById('grid-toggle').classList.toggle('active', state.gridEnabled);
  drawGrid();
  autoSave();
});

document.getElementById('undo-btn').addEventListener('click', undo);
document.getElementById('redo-btn').addEventListener('click', redo);

// Export dropdown
document.getElementById('export-wrap-btn').addEventListener('click', (e) => {
  document.getElementById('export-dropdown').classList.toggle('open');
  e.stopPropagation();
});
document.getElementById('export-json-btn').addEventListener('click', () => {
  document.getElementById('export-dropdown').classList.remove('open');
  exportJSON();
});
document.getElementById('export-png-btn').addEventListener('click', () => {
  document.getElementById('export-dropdown').classList.remove('open');
  exportPNG();
});

document.getElementById('import-btn').addEventListener('click', () => document.getElementById('file-input').click());
document.getElementById('file-input').addEventListener('change', (e) => {
  if (e.target.files[0]) importJSON(e.target.files[0]);
  e.target.value = '';
});

// Zoom
document.getElementById('zoom-in').addEventListener('click', () => zoomTo(state.zoom * 1.2));
document.getElementById('zoom-out').addEventListener('click', () => zoomTo(state.zoom / 1.2));
document.getElementById('zoom-fit').addEventListener('click', zoomFit);

function zoomTo(newZoom, cx, cy) {
  cx = cx || window.innerWidth / 2;
  cy = cy || window.innerHeight / 2;
  const old = state.zoom;
  state.zoom = Math.max(0.1, Math.min(5, newZoom));
  state.panX = cx - (cx - state.panX) * (state.zoom / old);
  state.panY = cy - (cy - state.panY) * (state.zoom / old);
  updateTransform();
  autoSave();
}

function zoomFit() {
  if (!state.nodes.length) return;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  state.nodes.forEach(n => {
    minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + (n.width || 140));
    maxY = Math.max(maxY, n.y + (n.height || 60));
  });
  const pad = 80;
  const w = maxX - minX + pad * 2, h = maxY - minY + pad * 2;
  const vw = window.innerWidth, vh = window.innerHeight;
  state.zoom = Math.min(vw / w, vh / h, 2);
  state.panX = (vw - w * state.zoom) / 2 - minX * state.zoom + pad * state.zoom;
  state.panY = (vh - h * state.zoom) / 2 - minY * state.zoom + pad * state.zoom;
  updateTransform();
  autoSave();
}

// ─── INTERACTION STATE ───
let isDragging = false, isPanning = false, isSelecting = false, isResizing = false;
let dragStartX = 0, dragStartY = 0;
let dragOffsets = [];
let spaceHeld = false;
let connectTempLine = null;

// ─── COLOR POPUP ───
function showColorPopup(x, y, currentColor, cb) {
  const swatches = document.getElementById('color-swatches');
  swatches.innerHTML = '';
  PALETTE.forEach(c => {
    const s = document.createElement('div');
    s.className = 'color-swatch' + (c === currentColor ? ' active' : '');
    s.style.background = c;
    s.addEventListener('click', () => { cb(c); colorPopup.classList.remove('open'); });
    swatches.appendChild(s);
  });
  document.getElementById('custom-color').value = currentColor || '#6c8aff';
  document.getElementById('custom-color').onchange = (e) => { cb(e.target.value); colorPopup.classList.remove('open'); };
  colorPopup.style.left = Math.min(x, window.innerWidth - 220) + 'px';
  colorPopup.style.top = Math.min(y, window.innerHeight - 200) + 'px';
  colorPopup.classList.add('open');
}

// ─── CANVAS EVENTS ───
canvasContainer.addEventListener('mousedown', (e) => {
  closeMenus();

  if (e.button === 1 || (e.button === 0 && spaceHeld)) {
    isPanning = true;
    dragStartX = e.clientX - state.panX;
    dragStartY = e.clientY - state.panY;
    canvasContainer.classList.add('panning');
    e.preventDefault();
    return;
  }

  if (e.button !== 0) return;

  const target = e.target.closest('.node');
  const anchor = e.target.closest('.anchor');
  const resizeH = e.target.closest('.resize-handle');
  const cp = screenToCanvas(e.clientX, e.clientY);

  // Anchor → connect
  if (anchor && target) {
    startConnection(parseInt(target.dataset.id), e);
    return;
  }

  // Resize
  if (resizeH && target) {
    isResizing = true;
    const nid = parseInt(target.dataset.id);
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    dragOffsets = [{ id: nid, origW: target.offsetWidth, origH: target.offsetHeight }];
    saveSnapshot();
    e.preventDefault();
    return;
  }

  // Connect tool on node
  if (state.tool === 'connect' && target) {
    startConnection(parseInt(target.dataset.id), e);
    return;
  }

  // Click node → select + drag
  if (target && (state.tool === 'select' || state.tool === 'connect')) {
    const nid = parseInt(target.dataset.id);
    if (e.shiftKey) {
      state.selectedIds.has(nid) ? state.selectedIds.delete(nid) : state.selectedIds.add(nid);
    } else if (!state.selectedIds.has(nid)) {
      state.selectedIds.clear();
      state.selectedIds.add(nid);
    }
    renderSelectionState();

    isDragging = true;
    dragStartX = cp.x;
    dragStartY = cp.y;
    dragOffsets = [];
    state.selectedIds.forEach(id => {
      const n = state.nodes.find(nn => nn.id === id);
      if (n) dragOffsets.push({ id, ox: n.x - cp.x, oy: n.y - cp.y });
    });
    saveSnapshot();
    e.preventDefault();
    return;
  }

  // Click empty canvas → create or select
  if (!target) {
    if (state.tool === 'sector') {
      showColorPopup(e.clientX, e.clientY, '#6c8aff', (color) => {
        saveSnapshot();
        const node = { id: genId(), type: 'sector', x: snapToGrid(cp.x), y: snapToGrid(cp.y), label: 'Neuer Sektor', color, width: null, height: null };
        state.nodes.push(node);
        fullRender();
        setTimeout(() => editNodeLabel(node.id), 100);
      });
      return;
    }

    if (state.tool === 'company') {
      let nearestSector = null, minDist = Infinity;
      state.nodes.filter(n => n.type === 'sector').forEach(s => {
        const d = Math.hypot(cp.x - s.x, cp.y - s.y);
        if (d < minDist) { minDist = d; nearestSector = s; }
      });
      saveSnapshot();
      const node = { id: genId(), type: 'company', x: snapToGrid(cp.x), y: snapToGrid(cp.y), label: 'Neue Firma', color: nearestSector ? nearestSector.color : '#6c8aff' };
      state.nodes.push(node);
      if (nearestSector && minDist < 600) {
        state.connections.push({ id: genId(), from: nearestSector.id, to: node.id, color: nearestSector.color });
      }
      fullRender();
      setTimeout(() => editNodeLabel(node.id), 100);
      return;
    }

    if (state.tool === 'sticky') {
      saveSnapshot();
      const node = { id: genId(), type: 'sticky', x: snapToGrid(cp.x), y: snapToGrid(cp.y), label: '', color: STICKY_COLORS[Math.floor(Math.random() * STICKY_COLORS.length)], width: 160, height: 120 };
      state.nodes.push(node);
      fullRender();
      setTimeout(() => editNodeLabel(node.id), 100);
      return;
    }

    if (state.tool === 'shape') {
      saveSnapshot();
      const node = { id: genId(), type: state.shapeType, x: snapToGrid(cp.x), y: snapToGrid(cp.y), label: '', color: null, borderColor: null, width: state.shapeType === 'circle' ? 100 : (state.shapeType === 'textbox' ? null : 140), height: state.shapeType === 'circle' ? 100 : (state.shapeType === 'textbox' ? null : 80) };
      state.nodes.push(node);
      fullRender();
      setTimeout(() => editNodeLabel(node.id), 100);
      return;
    }

    // Selection rect
    if (state.tool === 'select') {
      if (!e.shiftKey) state.selectedIds.clear();
      renderSelectionState();
      isSelecting = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      selRect.style.left = e.clientX + 'px';
      selRect.style.top = e.clientY + 'px';
      selRect.style.width = '0';
      selRect.style.height = '0';
      selRect.style.display = 'block';
      canvasContainer.classList.add('selecting');
    }
  }
});

function startConnection(fromId, e) {
  state.connectingFrom = fromId;
  const fc = getNodeCenter(state.nodes.find(n => n.id === fromId));
  connectTempLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  connectTempLine.setAttribute('x1', fc.x);
  connectTempLine.setAttribute('y1', fc.y);
  connectTempLine.setAttribute('x2', fc.x);
  connectTempLine.setAttribute('y2', fc.y);
  connectTempLine.setAttribute('stroke', state.connectionColor);
  connectTempLine.setAttribute('stroke-width', '2');
  connectTempLine.setAttribute('stroke-dasharray', '6,4');
  connectTempLine.setAttribute('stroke-opacity', '0.7');
  svgLayer.appendChild(connectTempLine);
  canvasContainer.classList.add('connecting');
  e.preventDefault();
}

canvasContainer.addEventListener('mousemove', (e) => {
  if (isPanning) {
    state.panX = e.clientX - dragStartX;
    state.panY = e.clientY - dragStartY;
    updateTransform();
    return;
  }

  if (isDragging) {
    const cp = screenToCanvas(e.clientX, e.clientY);
    dragOffsets.forEach(d => {
      const node = state.nodes.find(n => n.id === d.id);
      if (!node) return;
      node.x = e.altKey ? cp.x + d.ox : snapToGrid(cp.x + d.ox);
      node.y = e.altKey ? cp.y + d.oy : snapToGrid(cp.y + d.oy);
      const el = nodesLayer.querySelector(`[data-id="${d.id}"]`);
      if (el) { el.style.left = node.x + 'px'; el.style.top = node.y + 'px'; }
    });
    renderConnections();
    updateMinimap();
    return;
  }

  if (isSelecting) {
    const x = Math.min(e.clientX, dragStartX), y = Math.min(e.clientY, dragStartY);
    selRect.style.left = x + 'px';
    selRect.style.top = y + 'px';
    selRect.style.width = Math.abs(e.clientX - dragStartX) + 'px';
    selRect.style.height = Math.abs(e.clientY - dragStartY) + 'px';
    return;
  }

  if (isResizing) {
    const d = dragOffsets[0];
    const node = state.nodes.find(n => n.id === d.id);
    if (node) {
      node.width = Math.max(80, d.origW + (e.clientX - dragStartX) / state.zoom);
      node.height = Math.max(60, d.origH + (e.clientY - dragStartY) / state.zoom);
      const el = nodesLayer.querySelector(`[data-id="${d.id}"]`);
      if (el) { el.style.width = node.width + 'px'; el.style.minHeight = node.height + 'px'; el.style.height = node.height + 'px'; }
    }
    return;
  }

  if (state.connectingFrom && connectTempLine) {
    const cp = screenToCanvas(e.clientX, e.clientY);
    connectTempLine.setAttribute('x2', cp.x);
    connectTempLine.setAttribute('y2', cp.y);
  }
});

canvasContainer.addEventListener('mouseup', (e) => {
  if (isPanning) { isPanning = false; canvasContainer.classList.remove('panning'); autoSave(); return; }
  if (isDragging) { isDragging = false; autoSave(); return; }
  if (isResizing) { isResizing = false; autoSave(); return; }

  if (isSelecting) {
    isSelecting = false;
    selRect.style.display = 'none';
    canvasContainer.classList.remove('selecting');
    const rx = Math.min(e.clientX, dragStartX), ry = Math.min(e.clientY, dragStartY);
    const rw = Math.abs(e.clientX - dragStartX), rh = Math.abs(e.clientY - dragStartY);
    if (rw > 5 && rh > 5) {
      const tl = screenToCanvas(rx, ry), br = screenToCanvas(rx + rw, ry + rh);
      state.nodes.forEach(n => {
        const el = nodesLayer.querySelector(`[data-id="${n.id}"]`);
        if (!el) return;
        const cx = n.x + el.offsetWidth / 2, cy = n.y + el.offsetHeight / 2;
        if (cx >= tl.x && cx <= br.x && cy >= tl.y && cy <= br.y) state.selectedIds.add(n.id);
      });
      renderSelectionState();
    }
    return;
  }

  // Finish connection
  if (state.connectingFrom !== null) {
    if (connectTempLine) { connectTempLine.remove(); connectTempLine = null; }
    canvasContainer.classList.remove('connecting');
    const target = e.target.closest('.node');
    if (target) {
      const toId = parseInt(target.dataset.id);
      if (toId !== state.connectingFrom) {
        const exists = state.connections.some(c => (c.from === state.connectingFrom && c.to === toId) || (c.from === toId && c.to === state.connectingFrom));
        if (!exists) {
          saveSnapshot();
          state.connections.push({ id: genId(), from: state.connectingFrom, to: toId, color: state.connectionColor });
          renderConnections();
          autoSave();
        }
      }
    }
    state.connectingFrom = null;
  }
});

// Double-click to edit
canvasContainer.addEventListener('dblclick', (e) => {
  const target = e.target.closest('.node');
  if (target) { editNodeLabel(parseInt(target.dataset.id)); e.preventDefault(); }
});

function editNodeLabel(id) {
  const el = nodesLayer.querySelector(`[data-id="${id}"] .node-label`);
  if (!el) return;
  el.setAttribute('contenteditable', 'true');
  el.focus();
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);

  const finish = () => {
    el.setAttribute('contenteditable', 'false');
    const node = state.nodes.find(n => n.id === id);
    if (node) { node.label = el.textContent.trim(); autoSave(); }
    el.removeEventListener('blur', finish);
    el.removeEventListener('keydown', onKey);
  };
  const onKey = (ev) => {
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); el.blur(); }
    if (ev.key === 'Escape') el.blur();
    ev.stopPropagation();
  };
  el.addEventListener('blur', finish);
  el.addEventListener('keydown', onKey);
}

function renderSelectionState() {
  nodesLayer.querySelectorAll('.node').forEach(el => {
    el.classList.toggle('selected', state.selectedIds.has(parseInt(el.dataset.id)));
  });
}

// ─── CONTEXT MENU ───
canvasContainer.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  const target = e.target.closest('.node');
  const connPath = e.target.closest('path[data-id]');

  if (target) {
    const nid = parseInt(target.dataset.id);
    if (!state.selectedIds.has(nid)) { state.selectedIds.clear(); state.selectedIds.add(nid); renderSelectionState(); }
    showContextMenu(e.clientX, e.clientY, 'node');
  } else if (connPath) {
    state._contextConnId = parseInt(connPath.dataset.id);
    showContextMenu(e.clientX, e.clientY, 'connection');
  }
});

function showContextMenu(x, y, type) {
  contextMenu.innerHTML = '';
  if (type === 'node') {
    addCtxItem('Bearbeiten', 'Dbl-Click', () => state.selectedIds.forEach(id => editNodeLabel(id)));
    addCtxItem('Farbe aendern', '', () => {
      const first = [...state.selectedIds][0];
      const node = state.nodes.find(n => n.id === first);
      showColorPopup(x, y, node?.color || '#6c8aff', (color) => {
        saveSnapshot();
        state.selectedIds.forEach(id => { const n = state.nodes.find(nn => nn.id === id); if (n) n.color = color; });
        fullRender();
      });
    });
    addCtxItem('Duplizieren', 'Ctrl+D', duplicateSelected);
    addCtxSep();
    addCtxItem('Loeschen', 'Del', deleteSelected, true);
  } else if (type === 'connection') {
    addCtxItem('Farbe aendern', '', () => {
      const conn = state.connections.find(c => c.id === state._contextConnId);
      showColorPopup(x, y, conn?.color || '#6c8aff', (color) => {
        saveSnapshot();
        if (conn) conn.color = color;
        renderConnections();
        autoSave();
      });
    });
    addCtxSep();
    addCtxItem('Verbindung loeschen', 'Del', () => {
      saveSnapshot();
      state.connections = state.connections.filter(c => c.id !== state._contextConnId);
      renderConnections();
      autoSave();
    }, true);
  }
  contextMenu.style.left = x + 'px';
  contextMenu.style.top = y + 'px';
  contextMenu.classList.add('open');
}

function addCtxItem(label, shortcut, cb, danger) {
  const el = document.createElement('div');
  el.className = 'ctx-item' + (danger ? ' danger' : '');
  const labelSpan = document.createElement('span');
  labelSpan.textContent = label;
  el.appendChild(labelSpan);
  if (shortcut) {
    const sc = document.createElement('span');
    sc.className = 'shortcut';
    sc.textContent = shortcut;
    el.appendChild(sc);
  }
  el.addEventListener('click', () => { closeMenus(); cb(); });
  contextMenu.appendChild(el);
}

function addCtxSep() {
  const el = document.createElement('div');
  el.className = 'ctx-sep';
  contextMenu.appendChild(el);
}

function closeMenus() {
  contextMenu.classList.remove('open');
  colorPopup.classList.remove('open');
  document.getElementById('shapes-dropdown').classList.remove('open');
  document.getElementById('export-dropdown').classList.remove('open');
}

// ─── ACTIONS ───
function deleteSelected() {
  if (!state.selectedIds.size) return;
  saveSnapshot();
  state.connections = state.connections.filter(c => !state.selectedIds.has(c.from) && !state.selectedIds.has(c.to));
  state.nodes = state.nodes.filter(n => !state.selectedIds.has(n.id));
  state.selectedIds.clear();
  fullRender();
}

function duplicateSelected() {
  if (!state.selectedIds.size) return;
  saveSnapshot();
  const idMap = new Map(), newIds = new Set();
  state.selectedIds.forEach(id => {
    const n = state.nodes.find(nn => nn.id === id);
    if (!n) return;
    const newId = genId();
    idMap.set(id, newId);
    newIds.add(newId);
    state.nodes.push({ ...n, id: newId, x: n.x + 30, y: n.y + 30 });
  });
  state.connections.forEach(c => {
    if (idMap.has(c.from) && idMap.has(c.to)) {
      state.connections.push({ id: genId(), from: idMap.get(c.from), to: idMap.get(c.to), color: c.color });
    }
  });
  state.selectedIds.clear();
  newIds.forEach(id => state.selectedIds.add(id));
  fullRender();
}

// ─── KEYBOARD ───
document.addEventListener('keydown', (e) => {
  if (e.target.isContentEditable) return;
  if (e.key === ' ') { spaceHeld = true; e.preventDefault(); }
  if (e.key === 'v' || e.key === 'V') setTool('select');
  if ((e.key === 'c' || e.key === 'C') && !e.ctrlKey && !e.metaKey) setTool('connect');
  if (e.key === 'g' || e.key === 'G') {
    state.gridEnabled = !state.gridEnabled;
    document.getElementById('grid-toggle').classList.toggle('active', state.gridEnabled);
    drawGrid();
  }
  if (e.key === 'Delete' || e.key === 'Backspace') { deleteSelected(); e.preventDefault(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { undo(); e.preventDefault(); }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.shiftKey && e.key === 'z'))) { redo(); e.preventDefault(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'd') { duplicateSelected(); e.preventDefault(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'a') {
    state.nodes.forEach(n => state.selectedIds.add(n.id));
    renderSelectionState();
    e.preventDefault();
  }
  if (e.key === 'Escape') { state.selectedIds.clear(); renderSelectionState(); closeMenus(); setTool('select'); }
});

document.addEventListener('keyup', (e) => { if (e.key === ' ') spaceHeld = false; });

// Close menus on click outside
document.addEventListener('click', (e) => {
  if (!e.target.closest('#context-menu')) contextMenu.classList.remove('open');
  if (!e.target.closest('.color-popup') && !e.target.closest('.ctx-item')) colorPopup.classList.remove('open');
  if (!e.target.closest('.dropdown-wrap')) {
    document.getElementById('shapes-dropdown').classList.remove('open');
    document.getElementById('export-dropdown').classList.remove('open');
  }
});

// Scroll zoom
canvasContainer.addEventListener('wheel', (e) => {
  e.preventDefault();
  zoomTo(state.zoom * (e.deltaY > 0 ? 0.92 : 1.08), e.clientX, e.clientY);
}, { passive: false });

// Resize
window.addEventListener('resize', () => { drawGrid(); updateMinimap(); });

// ─── INIT ───
autoLoad();
document.getElementById('grid-toggle').classList.toggle('active', state.gridEnabled);
fullRender();
if (!state.nodes.length) {
  state.panX = window.innerWidth / 2 - 200;
  state.panY = window.innerHeight / 2 - 100;
  updateTransform();
}
</script>
</body>
