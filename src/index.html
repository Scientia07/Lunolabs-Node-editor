<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netzwerk-Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/toolbar.css">
<link rel="stylesheet" href="styles/canvas.css">
<link rel="stylesheet" href="styles/nodes.css">
<link rel="stylesheet" href="styles/popups.css">
<link rel="stylesheet" href="styles/panels.css">
<link rel="stylesheet" href="styles/toast.css">
</head>
<body>

<!-- TOOLBAR -->
<div id="toolbar">
  <button class="tb-btn active" data-tool="select" title="Auswahl (V)">
    <svg viewBox="0 0 24 24"><path d="M4 4l7 17 2.5-6.5L20 12z"/></svg>
    <span>Auswahl</span>
  </button>
  <div class="sep"></div>
  <button class="tb-btn" data-tool="sector" title="Sektor hinzufuegen">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    <span>Sektor</span>
  </button>
  <button class="tb-btn" data-tool="company" title="Firma/Eintrag hinzufuegen">
    <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><line x1="12" y1="9" x2="12" y2="15"/><line x1="9" y1="12" x2="15" y2="12"/></svg>
    <span>Eintrag</span>
  </button>
  <div class="sep"></div>
  <button class="tb-btn" data-tool="sticky" title="Sticky Note">
    <svg viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 00-2 2v14a2 2 0 002 2h9l5-5V5a2 2 0 00-2-2z"/><polyline points="14 17 14 21 19 16"/></svg>
    <span>Sticky</span>
  </button>
  <div class="dropdown-wrap">
    <button class="tb-btn" data-tool="shapes" id="shapes-btn" title="Formen">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><circle cx="17" cy="17" r="4"/></svg>
      <span>Formen</span>
      <svg viewBox="0 0 24 24" style="width:12px;height:12px;margin-left:-2px"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="dropdown-menu" id="shapes-dropdown">
      <div class="dropdown-item" data-shape="rect">
        <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8"><rect x="4" y="6" width="16" height="12" rx="2"/></svg>
        Rechteck
      </div>
      <div class="dropdown-item" data-shape="circle">
        <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8"><circle cx="12" cy="12" r="8"/></svg>
        Kreis
      </div>
      <div class="dropdown-item" data-shape="textbox">
        <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
        Textbox
      </div>
    </div>
  </div>
  <button class="tb-btn" data-tool="connect" title="Verbindung (C)">
    <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"/><circle cx="5" cy="19" r="2" fill="currentColor"/><circle cx="19" cy="5" r="2" fill="currentColor"/></svg>
    <span>Verbinden</span>
  </button>
  <div class="sep"></div>
  <button class="tb-btn icon-only" id="grid-toggle" title="Raster (G)">
    <svg viewBox="0 0 24 24"><line x1="12" y1="3" x2="12" y2="21"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="3" x2="3" y2="21"/><line x1="21" y1="3" x2="21" y2="21"/><line x1="3" y1="3" x2="21" y2="3"/><line x1="3" y1="21" x2="21" y2="21"/></svg>
  </button>
  <button class="tb-btn icon-only" id="theme-toggle" title="Theme umschalten">
    <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
  </button>
  <div class="sep"></div>
  <button class="tb-btn icon-only" id="undo-btn" title="Ctrl+Z">
    <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 105.64-8.36L1 10"/></svg>
  </button>
  <button class="tb-btn icon-only" id="redo-btn" title="Ctrl+Y">
    <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-5.64-8.36L23 10"/></svg>
  </button>
  <div class="sep"></div>

  <!-- Export dropdown -->
  <div class="dropdown-wrap">
    <button class="tb-btn" id="export-wrap-btn" title="Exportieren">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>Export</span>
      <svg viewBox="0 0 24 24" style="width:12px;height:12px;margin-left:-2px"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="export-dropdown" id="export-dropdown">
      <div class="dropdown-item" id="export-json-btn">
        <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        JSON speichern
      </div>
      <div class="dropdown-item" id="export-png-btn">
        <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        PNG exportieren
      </div>
    </div>
  </div>

  <button class="tb-btn icon-only" id="import-btn" title="Importieren">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
  </button>
</div>

<!-- CANVAS -->
<div id="canvas-container">
  <canvas id="grid-canvas"></canvas>
  <div id="canvas">
    <svg id="connections-layer"></svg>
    <div id="nodes-layer"></div>
  </div>
  <div id="selection-rect"></div>
</div>

<!-- LEGEND (populated by project.js) -->
<div id="legend"></div>

<!-- MINIMAP -->
<div id="minimap">
  <canvas id="minimap-canvas"></canvas>
  <div id="minimap-viewport"></div>
</div>

<!-- ZOOM CONTROLS -->
<div id="zoom-indicator">
  <button class="tb-btn" id="zoom-out">
    <svg viewBox="0 0 24 24" style="width:14px;height:14px"><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
  <span id="zoom-level">100%</span>
  <button class="tb-btn" id="zoom-in">
    <svg viewBox="0 0 24 24" style="width:14px;height:14px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
  <button class="tb-btn" id="zoom-fit" style="font-size:10px;font-family:var(--font-mono)">FIT</button>
</div>

<!-- CONTEXT MENU -->
<div id="context-menu"></div>

<!-- COLOR POPUP (simple swatch picker) -->
<div class="color-popup" id="color-popup">
  <h4>Farbe waehlen</h4>
  <div class="color-swatches" id="color-swatches"></div>
  <input type="color" id="custom-color" value="#6c8aff">
</div>

<!-- GRADIENT POPUP -->
<div class="popup-panel" id="gradient-popup">
  <h4>Farbe / Verlauf</h4>
  <div class="gradient-preview" id="gradient-preview"></div>
  <div class="color-swatches" id="grad-swatches"></div>
  <label>Farbe 1</label>
  <div class="color-row">
    <input type="color" id="grad-color1" value="#6c8aff">
    <span id="grad-hex1" style="font-size:11px;color:var(--text-dim);font-family:var(--font-mono)">#6c8aff</span>
  </div>
  <label>Farbe 2 (Verlauf)</label>
  <div class="color-row">
    <input type="color" id="grad-color2" value="#6c8aff">
    <span id="grad-hex2" style="font-size:11px;color:var(--text-dim);font-family:var(--font-mono)">#6c8aff</span>
  </div>
  <label>Winkel: <span id="grad-angle-val">135</span>&deg;</label>
  <input type="range" id="grad-angle" min="0" max="360" value="135" style="width:100%">
  <button class="popup-btn" id="grad-apply">Anwenden</button>
</div>

<!-- FONT POPUP -->
<div class="popup-panel" id="font-popup">
  <h4>Schriftart</h4>
  <div class="font-list" id="font-list"></div>
  <label style="margin-top:12px">Groesse: <span id="font-size-val">13</span>px</label>
  <input type="range" id="font-size" min="9" max="24" value="13" style="width:100%">
  <label>Staerke</label>
  <select id="font-weight" style="width:100%;padding:6px;border:1px solid var(--border);border-radius:6px;font-family:var(--font-body);font-size:12px">
    <option value="300">Light</option>
    <option value="400" selected>Regular</option>
    <option value="500">Medium</option>
    <option value="600">Semibold</option>
    <option value="700">Bold</option>
  </select>
  <button class="popup-btn" id="font-apply">Anwenden</button>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- HIDDEN FILE INPUT -->
<input type="file" id="file-input" accept=".json" style="display:none">

<script type="module" src="js/main.js"></script>
</body>
</html>
